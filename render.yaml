services:
  - type: web
    name: capstone-project
    runtime: docker
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /

    envVars:
      - key: APP_NAME
        value: PyroSense

      - key: APP_ENV
        value: production

      - key: APP_DEBUG
        value: "false"

      - key: APP_URL
        sync: false

      - key: APP_KEY
        sync: false

      - key: LOG_CHANNEL
        value: stderr

      - key: LOG_LEVEL
        value: info

      # PostgreSQL / Supabase
      - key: DB_CONNECTION
        value: pgsql

      - key: DB_HOST
        sync: false

      - key: DB_PORT
        value: "5432"

      - key: DB_DATABASE
        sync: false

      - key: DB_USERNAME
        sync: false

      - key: DB_PASSWORD
        sync: false

      - key: DB_SSLMODE
        value: require

      # Laravel
      - key: SESSION_DRIVER
        value: file

      - key: CACHE_STORE
        value: file

      - key: QUEUE_CONNECTION
        value: sync

      # Supabase Storage
      - key: FILESYSTEM_DISK
        value: supabase

      - key: SUPABASE_KEY
        sync: false

      - key: SUPABASE_SECRET
        sync: false

      - key: SUPABASE_REGION
        sync: false

      - key: SUPABASE_STORAGE_BUCKET
        sync: false

      - key: SUPABASE_URL
        sync: false

      - key: SUPABASE_ENDPOINT
        sync: false

      # AI
      - key: AI_PYTHON_BINARY
        value: python3

      - key: AI_PREDICTION_SCRIPT
        value: capstone-ai/predict_event.py

      - key: AI_MODEL_PATH
        value: capstone-ai/fire_model.pkl

      - key: AI_TRAINING_TIMEOUT_SECONDS
        value: "240"

      - key: AI_TRAINING_QUEUE_CONNECTION
        value: database

      - key: AI_TRAINING_QUEUE
        value: forecast-training

      - key: AI_TRAINING_STATUS_CACHE_STORE
        value: database

      - key: AI_ARTIFACT_PERSISTENCE_ENABLED
        value: "true"

      - key: AI_ARTIFACT_DISK
        value: supabase

      - key: AI_ARTIFACT_PREFIX
        value: ai/forecast-model

      - key: DB_QUEUE_RETRY_AFTER
        value: "360"

      - key: RUN_FORECAST_QUEUE_WORKER
        value: "true"

      - key: AI_QUEUE_WORKER_TIMEOUT
        value: "300"

      - key: AI_MODEL_METADATA_PATH
        value: capstone-ai/fire_model_metadata.json

      - key: RUN_MIGRATIONS
        # The mitigation workflow relies on additive schema migrations. Laravel
        # records applied migrations, so running this at deploy time is safe and
        # keeps the production database aligned with the deployed code.
        value: "true"

      - key: RUN_DAILY_WEATHER_WORKER
        # Runs only the idempotent daily weather collector inside the existing
        # web container, avoiding a separately billed Render Cron service.
        value: "true"

      # OpenRouter
      - key: OPENROUTER_MODEL
        sync: false

      - key: OPENROUTER_API_KEY
        sync: false

      # Google OAuth
      - key: GOOGLE_CLIENT_ID
        sync: false

      - key: GOOGLE_CLIENT_SECRET
        sync: false

      - key: GOOGLE_REDIRECT_URI
        sync: false
