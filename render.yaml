services:
  - type: web
    name: capstone-project
    runtime: docker
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /health/ready
    maxShutdownDelaySeconds: 90

    envVars:
      - key: APP_NAME
        value: PyroSense

      - key: APP_ENV
        value: production

      - key: APP_DEBUG
        value: "false"

      - key: APP_URL
        sync: false

      - key: APP_KEY
        sync: false

      - key: LOG_CHANNEL
        value: stderr

      - key: LOG_LEVEL
        value: info

      # PostgreSQL / Supabase
      - key: DB_CONNECTION
        value: pgsql

      - key: DB_HOST
        sync: false

      - key: DB_PORT
        value: "5432"

      - key: DB_DATABASE
        sync: false

      - key: DB_USERNAME
        sync: false

      - key: DB_PASSWORD
        sync: false

      - key: DB_SSLMODE
        value: require

      # Laravel
      - key: SESSION_DRIVER
        value: database

      - key: CACHE_STORE
        # Keep the local file cache as the primary store, but do not turn a
        # transient Render filesystem failure into an HTTP 500 response.
        value: failover

      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: pyrosense-shared-state
          property: connectionString

      - key: ROLLOUT_MODE
        value: pilot

      - key: PILOT_STATION_IDS
        sync: false

      - key: BACKUP_DISK
        value: backups

      - key: BACKUP_ACCESS_KEY_ID
        sync: false

      - key: BACKUP_SECRET_ACCESS_KEY
        sync: false

      - key: BACKUP_BUCKET
        sync: false

      - key: BACKUP_ENDPOINT
        sync: false

      - key: QUEUE_CONNECTION
        value: database

      - key: AAR_NOTIFICATION_QUEUE_CONNECTION
        value: database

      - key: RUN_NOTIFICATION_QUEUE_WORKER
        value: "false"

      # Supabase Storage
      - key: FILESYSTEM_DISK
        value: supabase

      - key: SUPABASE_KEY
        sync: false

      - key: SUPABASE_SECRET
        sync: false

      - key: SUPABASE_REGION
        sync: false

      - key: SUPABASE_STORAGE_BUCKET
        sync: false

      - key: SUPABASE_URL
        sync: false

      - key: SUPABASE_ENDPOINT
        sync: false

      # AI
      - key: AI_PYTHON_BINARY
        value: python3

      - key: AI_PREDICTION_SCRIPT
        value: capstone-ai/predict_event.py

      - key: AI_MODEL_PATH
        value: capstone-ai/fire_model.pkl

      - key: AI_TRAINING_TIMEOUT_SECONDS
        value: "240"

      - key: AI_TRAINING_QUEUE_CONNECTION
        value: database

      - key: AI_TRAINING_QUEUE
        value: forecast-training

      - key: AI_TRAINING_STATUS_CACHE_STORE
        value: database

      - key: AI_ARTIFACT_PERSISTENCE_ENABLED
        value: "true"

      - key: AI_ARTIFACT_DISK
        value: supabase

      - key: AI_ARTIFACT_PREFIX
        value: ai/forecast-model

      - key: DB_QUEUE_RETRY_AFTER
        value: "360"

      - key: RUN_FORECAST_QUEUE_WORKER
        value: "false"

      - key: AI_QUEUE_WORKER_TIMEOUT
        value: "300"

      - key: AI_MODEL_METADATA_PATH
        value: capstone-ai/fire_model_metadata.json

      - key: RUN_MIGRATIONS
        # The mitigation workflow relies on additive schema migrations. Laravel
        # records applied migrations, so running this at deploy time is safe and
        # keeps the production database aligned with the deployed code.
        value: "true"

      - key: RUN_DAILY_WEATHER_WORKER
        # Runs only the idempotent daily weather collector inside the existing
        # web container, avoiding a separately billed Render Cron service.
        value: "true"

      # OpenRouter
      - key: OPENROUTER_MODEL
        sync: false

      - key: OPENROUTER_API_KEY
        sync: false

      # Google OAuth
      - key: GOOGLE_CLIENT_ID
        sync: false

      - key: GOOGLE_CLIENT_SECRET
        sync: false

      - key: GOOGLE_REDIRECT_URI
        sync: false

  - type: worker
    name: pyrosense-general-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: /usr/local/bin/render-worker.sh
    maxShutdownDelaySeconds: 120
    envVars:
      - key: APP_NAME
        value: PyroSense
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: CACHE_STORE
        value: redis
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: pyrosense-shared-state
          property: connectionString
      - key: WORKER_NAME
        value: general
      - key: WORKER_QUEUE_CONNECTION
        value: database
      - key: WORKER_QUEUES
        value: default,notifications,emails
      - key: WORKER_TIMEOUT
        value: "120"
      - key: WORKER_TRIES
        value: "3"
      - key: MAIL_MAILER
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false

  - type: worker
    name: pyrosense-forecast-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: /usr/local/bin/render-worker.sh
    maxShutdownDelaySeconds: 300
    envVars:
      - key: APP_NAME
        value: PyroSense
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: CACHE_STORE
        value: redis
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: pyrosense-shared-state
          property: connectionString
      - key: WORKER_NAME
        value: forecast
      - key: WORKER_QUEUE_CONNECTION
        value: database
      - key: WORKER_QUEUES
        value: forecast-training
      - key: WORKER_TIMEOUT
        value: "300"
      - key: WORKER_TRIES
        value: "2"
      - key: AI_ARTIFACT_DISK
        value: supabase
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SECRET
        sync: false
      - key: SUPABASE_REGION
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ENDPOINT
        sync: false

  - type: cron
    name: pyrosense-database-backup
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: php artisan ops:backup-database
    schedule: "30 18 * * *"
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_KEY
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: BACKUP_DISK
        value: backups
      - key: BACKUP_ACCESS_KEY_ID
        sync: false
      - key: BACKUP_SECRET_ACCESS_KEY
        sync: false
      - key: BACKUP_BUCKET
        sync: false
      - key: BACKUP_ENDPOINT
        sync: false
      - key: BACKUP_REGION
        value: auto
      - key: BACKUP_RETENTION_DAYS
        value: "35"

  - type: cron
    name: pyrosense-operations-monitor
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: php artisan ops:monitor
    schedule: "*/5 * * * *"
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_KEY
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: CACHE_STORE
        value: redis
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: pyrosense-shared-state
          property: connectionString
      - key: BACKUP_DISK
        value: backups
      - key: BACKUP_ACCESS_KEY_ID
        sync: false
      - key: BACKUP_SECRET_ACCESS_KEY
        sync: false
      - key: BACKUP_BUCKET
        sync: false
      - key: BACKUP_ENDPOINT
        sync: false
      - key: MONITORING_WEBHOOK_URL
        sync: false

  - type: keyvalue
    name: pyrosense-shared-state
    plan: 256mb
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: snapshot
